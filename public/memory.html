<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기억 꺼내기 — REMEMBER WAY AI</title>
  <link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f2f4f6">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="topbar"><a class="back" href="/profile">← 등록 정보</a><span class="step">기억 꺼내기 대화</span></div>
  <h1>기억 꺼내기</h1>
  <p class="muted">어르신이 예전에 사시던 곳, 자주 가시던 곳을 하나씩 떠올려 보는 대화예요. 말씀하신 내용에서 AI가 장소 이름만 뽑고, 보호자님이 확인하신 곳만 추억의 장소에 저장됩니다.</p>
  <p class="small muted">이름·전화번호는 말하지 말아 주세요. 말씀하신 내용은 장소를 뽑을 때만 AI 회사로 전달되고 이 앱의 서버에는 저장되지 않아요.</p>

  <div class="card hidden" id="no-profile">
    <h2 style="margin-top:0">먼저 어르신을 등록해 주세요</h2>
    <p class="muted">어르신을 뭐라고 부르는지 알아야 질문을 드릴 수 있어요. 한 번만 등록하면 됩니다.</p>
    <a class="btn btn-primary" href="/profile">평소 등록하러 가기</a>
  </div>

  <section id="talk" class="hidden">
    <div class="card" id="ask-card">
      <p class="small muted" id="progress" style="margin-top:0"></p>
      <h2 id="question" style="margin:4px 0 8px"></h2>
      <p class="small" id="note" role="status" aria-live="polite"></p>
      <div id="ask-ui">
        <button class="mic" id="mic" aria-pressed="false" aria-label="말로 답하기">🎙️</button>
        <p class="small muted" id="interim" style="text-align:center;min-height:1.2em"></p>
        <textarea id="answer" style="min-height:90px" aria-label="어르신에 대한 답" placeholder="말로 하거나 글로 적어 주세요. 예) 젊을 때 청주 육거리시장에서 장사하셨어요."></textarea>
        <button class="btn-primary" id="extract" style="margin-top:8px">이 답에서 장소 뽑기 (AI)</button>
      </div>
    </div>

    <div id="cands" class="stack"></div>

    <div class="card hidden" id="manual">
      <p id="manual-msg" style="margin-top:0"></p>
      <div class="row"><input type="text" id="manual-name" placeholder="장소 이름 직접 적기" aria-label="장소 이름 직접 적기" autocomplete="off"><button class="btn-secondary" id="manual-save" style="width:auto;flex:0 0 auto">저장</button></div>
    </div>

    <div class="row" id="nav" style="margin-top:12px"><button class="btn-secondary" id="skip">건너뛰기</button><button class="btn-secondary" id="stop">그만하기</button></div>
  </section>

  <section id="done" class="hidden">
    <div class="card">
      <h2 style="margin-top:0" id="done-title"></h2>
      <p class="muted" id="done-msg"></p>
      <div class="stack">
        <button class="btn-primary hidden" id="resume">이어서 하기</button>
        <a class="btn btn-secondary" href="/profile">등록 정보에서 확인하기</a>
        <a class="btn btn-secondary" href="/diary">매일 일지로</a>
      </div>
    </div>
  </section>
</main>
<script type="module">
  import { store, KEYS, api, createSpeech, $, el, mockBanner } from "/js/common.js";
  import { MEMORY_TOPICS, memoryQuestion } from "/lib/schema.js";
  import { appearsExactly } from "/lib/verify.js";

  // 질문 순서는 코드가 정한다 (MEMORY_TOPICS 순서). AI는 보호자의 답에서 장소 이름만 뽑고 후속 질문 하나만 만든다. 뽑힌 이름은 서버가 원문과 대조하고(verifyMemory), 보호자가 카드에서 [저장]한 것만 남는다.
  const DONE_KEY = "rw_memory_done"; // 이 탭에서 이미 지나간 주제 (새로 고침해도 이어서)
  const norm = (s) => String(s).replace(/\s+/g, "").toLowerCase();
  let profile = store.get(KEYS.profile);
  let done = store.sget(DONE_KEY, []), topic = null, question = "", followedUp = false, answerText = "", pendingFollowup = null, cands = [], savedTotal = 0, savedInTopic = 0;
  const ta = $("#answer");
  let speech = null;

  function init() {
    $("#talk").classList.remove("hidden");
    speech = createSpeech({ onText: (fin, interim) => { ta.value = fin; $("#interim").textContent = interim; }, onState: (on) => $("#mic").setAttribute("aria-pressed", String(on)) });
    if (!speech) { $("#mic").disabled = true; $("#interim").textContent = "이 브라우저는 말로 입력을 지원하지 않아요. 글로 적어 주세요."; } else $("#mic").onclick = () => (speech.listening ? speech.stop() : speech.start(ta.value));
    $("#extract").onclick = extract;
    $("#skip").onclick = () => { speech?.stop(); finishTopic(); nextTopic(); };
    $("#stop").onclick = () => { speech?.stop(); finish(); };
    $("#manual-save").onclick = manualSave;
    $("#manual-name").addEventListener("keydown", (e) => { if (e.key === "Enter") manualSave(); });
    $("#resume").onclick = () => nextTopic();
    nextTopic();
  }

  const honorific = () => profile.honorific || "어르신";
  const knownNames = () => (profile.places ?? []).map((p) => p.name);
  const view = (ids) => ["#ask-ui", "#cands", "#manual", "#nav", "#talk", "#done"].forEach((id) => $(id).classList.toggle("hidden", !ids.includes(id)));

  function nextTopic(note = "") {
    topic = MEMORY_TOPICS.find((t) => !done.includes(t.key));
    if (!topic) return finish();
    followedUp = false; savedInTopic = 0;
    ask(memoryQuestion(honorific(), topic), note);
  }
  function finishTopic() { if (topic && !done.includes(topic.key)) { done.push(topic.key); store.sset(DONE_KEY, done); } }

  function ask(q, note = "") {
    question = q; cands = []; $("#cands").innerHTML = ""; ta.value = ""; $("#interim").textContent = ""; $("#manual-name").value = "";
    $("#question").textContent = q;
    $("#progress").textContent = `${MEMORY_TOPICS.indexOf(topic) + 1} / ${MEMORY_TOPICS.length} · ${topic.label}`;
    $("#note").textContent = note;
    view(["#talk", "#ask-ui", "#nav"]);
  }

  async function extract() {
    const answer = ta.value.trim();
    if (answer.length < 2) { $("#note").textContent = "답을 말하거나 적어 주세요."; return; }
    speech?.stop();
    $("#extract").disabled = true; $("#extract").innerHTML = '<span class="spinner"></span> 뽑는 중';
    const res = await api("diary", { mode: "memory", honorific: honorific(), topic: topic.key, question, answer, knownPlaces: knownNames() });
    $("#extract").disabled = false; $("#extract").textContent = "이 답에서 장소 뽑기 (AI)";
    mockBanner(res);
    if (!res.ok) return manual((res.reason === "NO_CONSENT" ? "AI 정리에 동의하지 않아 AI를 쓰지 않았어요" : `AI를 쓸 수 없어요 (${res.reason})`) + ". 같은 질문에 장소 이름을 직접 적어 주세요.");
    answerText = answer; pendingFollowup = res.followup ?? null;
    cands = (res.places ?? []).map((p) => ({ name: p.name, evidence: p.evidence ?? "", state: "pending", editing: false }));
    if (cands.length) { $("#note").textContent = ""; view(["#talk", "#cands", "#nav"]); return renderCands(); }
    if (pendingFollowup && !followedUp) { followedUp = true; return ask(pendingFollowup, "장소 이름은 찾지 못했어요. 한 가지만 더 여쭐게요."); }
    if (savedInTopic) { finishTopic(); return nextTopic(); }
    manual("새로 뽑힌 장소가 없어요 (이미 등록된 곳은 빼고 보여 드려요). 직접 적으시거나, 다시 답하시거나, 다음 주제로 넘어가 주세요.");
  }

  // AI를 못 쓰거나 새 장소가 없을 때: 같은 질문 아래에 이름을 직접 적는 칸 (답을 다시 하셔도 됩니다)
  function manual(msg) {
    $("#manual-msg").textContent = msg;
    view(["#talk", "#ask-ui", "#manual", "#nav"]);
  }
  function manualSave() {
    const name = $("#manual-name").value.trim().replace(/\s+/g, " ");
    if (name.length < 2) { $("#manual-name").focus(); return; }
    const added = saveName(name, "직접 입력");
    finishTopic(); nextTopic(added ? `✓ ${name} 저장했어요.` : `${name}은(는) 이미 등록된 곳이에요.`);
  }

  // 저장: 이 기기의 등록 정보(profile.places)에 넣는다. 다른 가족 기기와의 동기화는 store.set 이 맡는다.
  function saveName(name, evidence) {
    const p = store.get(KEYS.profile) ?? profile; // 다른 탭에서 바뀌었을 수 있어 저장 직전에 다시 읽는다
    p.places = Array.isArray(p.places) ? p.places : [];
    profile = p;
    if (p.places.some((x) => norm(x.name) === norm(name))) return false;
    p.places.push({ name, source: "memory", evidence: "기억 꺼내기: " + evidence });
    p.updated_at = new Date().toISOString();
    store.set(KEYS.profile, p);
    savedTotal++; savedInTopic++;
    return true;
  }

  function renderCands() {
    const box = $("#cands"); box.innerHTML = "";
    for (const c of cands) {
      if (c.state === "no") continue;
      if (c.state === "saved" || c.state === "dup") { box.append(el("div", { class: "card tight" }, el("b", {}, c.name), c.state === "saved" ? " ✓ 저장했어요" : " · 이미 등록된 곳이에요")); continue; }
      if (c.editing) { box.append(editCard(c)); continue; }
      const exact = appearsExactly(c.name, answerText);
      box.append(el("div", { class: "card" },
        el("div", { class: "v" }, c.name, exact ? "" : el("span", { class: "badge warn", title: "말씀하신 내용에서 확인되지 않음" }, "⚠ 확인 필요")),
        exact ? "" : el("p", { class: "small muted" }, "말씀하신 내용에 이 이름이 그대로는 없어요. 맞는지 확인해 주세요."),
        c.evidence ? el("p", { class: "small muted" }, `"${c.evidence}"`) : "",
        el("div", { class: "stack", style: "margin-top:10px" },
          el("button", { class: "btn-primary", onclick: () => { c.state = saveName(c.name, c.evidence || topic.label) ? "saved" : "dup"; settle(); } }, "저장"),
          el("div", { class: "row" },
            el("button", { class: "btn-secondary", onclick: () => { c.state = "no"; settle(); } }, "아니에요"),
            el("button", { class: "btn-secondary", onclick: () => { c.editing = true; renderCands(); } }, "✎ 수정")))));
    }
  }
  function editCard(c) {
    const inp = el("input", { type: "text", "aria-label": "장소 이름 고치기", autocomplete: "off" });
    inp.value = c.name;
    const ok = () => { const v = inp.value.trim().replace(/\s+/g, " "); if (v.length < 2) return inp.focus(); c.name = v; c.editing = false; renderCands(); };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });
    queueMicrotask(() => inp.focus());
    return el("div", { class: "card" }, el("label", {}, "장소 이름 고치기"), inp,
      el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "btn-secondary", onclick: () => { c.editing = false; renderCands(); } }, "취소"), el("button", { class: "btn-primary", onclick: ok }, "확인")));
  }

  // 카드를 모두 정했으면: 후속 질문이 있으면 한 번만 더, 없으면 다음 주제
  function settle() {
    if (cands.some((c) => c.state === "pending")) return renderCands();
    const names = cands.filter((c) => c.state === "saved").map((c) => c.name);
    const note = names.length ? `✓ ${names.join(", ")} 저장했어요.` : "";
    if (pendingFollowup && !followedUp) { followedUp = true; return ask(pendingFollowup, note); }
    finishTopic(); nextTopic(note);
  }

  function finish() {
    const left = MEMORY_TOPICS.some((t) => !done.includes(t.key));
    if (!left) { done = []; store.sset(DONE_KEY, done); } // 한 바퀴를 다 돌았으면 다음에 처음부터
    $("#done-title").textContent = savedTotal ? `${savedTotal}곳을 저장했어요` : "수고하셨어요";
    $("#done-msg").textContent = (savedTotal ? "추억의 장소에 들어갔어요. 실종 때 확인할 곳의 순서에 쓰입니다. " : "") + (left ? "남은 주제는 나중에 이어서 하실 수 있어요." : "모든 주제를 이야기했어요.");
    $("#resume").classList.toggle("hidden", !left);
    view(["#done"]);
  }

  if (!profile) $("#no-profile").classList.remove("hidden");
  else init(); // 함수·상수가 모두 선언된 뒤에 시작
</script>
</body>
</html>
