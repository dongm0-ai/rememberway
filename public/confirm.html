<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>단서 확인 — REMEMBER WAY AI</title>
  <link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f2f4f6">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="topbar"><a class="back" href="/report">← 다시 말하기</a><span class="step">화면 2 / 3 · 확인·되묻기</span></div>
  <h1>이렇게 정리했어요. 맞나요?</h1>
  <section class="ai-card" id="ai-card"></section>
  <p class="muted"><span class="badge warn">⚠</span>는 보호자 말에서 확인되지 않은 값이니 꼭 봐 주세요. ✎로 고칠 수 있고, 고친 칸에는 "보호자 수정"이 붙습니다.</p>

  <section id="ask" class="card hidden">
    <div class="small muted" id="ask-count"></div>
    <div class="progress"><div id="ask-bar" style="width:0%"></div></div>
    <div class="q" id="ask-q"></div>
    <div id="ask-input"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn-primary" id="ask-answer">답하기</button>
      <button class="btn-secondary" id="ask-unknown">모름</button>
    </div>
  </section>
  <div id="ask-loading" class="card hidden"><span class="spinner"></span> 빠진 것을 확인하는 중…</div>

  <div class="card" id="fields"></div>
  <div class="card">
    <h3 style="margin-top:0">가실 만한 곳</h3>
    <div id="places" class="stack"></div>
    <div class="row" style="margin-top:8px"><input type="text" id="place-new" placeholder="추가할 곳"><button class="btn-secondary" id="place-add" style="width:auto">추가</button></div>
  </div>

  <dialog id="edit-dialog">
    <h3 id="edit-title" style="margin-top:0"></h3>
    <div id="edit-body"></div>
    <div class="row" style="margin-top:14px"><button class="btn-primary" id="edit-ok">저장</button><button class="btn-secondary" id="edit-cancel">취소</button></div>
    <button class="btn-ghost small" id="edit-clear" style="margin-top:6px">값 지우기 (모름으로)</button>
  </dialog>
  <div class="fixed-bottom"><div class="inner stack">
    <button class="btn-primary" id="go">요약·지도 보기 →</button>
    <button class="btn-ghost small" id="skip">질문 건너뛰고 바로 요약</button>
  </div></div>
</main>
<script type="module">
  import { store, KEYS, api, $, $$, el, mockBanner, aiName } from "/js/common.js";
  import { FIELD_LABELS, SOURCE_LABELS } from "/lib/schema.js";
  import { computeMissing, getPath, setPath } from "/lib/verify.js";
  import { buildAnswerInput } from "/js/answer-ui.js";

  const clue = store.sget(KEYS.clue);
  if (!clue) location.replace("/report");
  const mode = store.sget(KEYS.mode, {});
  if (mode.source === "mock") mockBanner({ mock: true });
  const utter = store.sget(KEYS.utterance, "");

  const keys = ["honorific", "home_dong", "last_seen.time", "last_seen.place", "today_destination", "route", "transport", "clothing.top", "clothing.bottom", "clothing.shoes", "clothing.hat", "gait", "items.phone", "items.wallet", "items.cane", "meds", "dementia_signs", "prior_incidents"];
  const isBool = (k) => k.startsWith("items.");
  const show = (k) => { const v = getPath(clue, k); return isBool(k) ? (v === true ? "있음" : v === false ? "없음" : null) : v; };

  function renderFields() {
    const box = $("#fields"); box.innerHTML = "";
    for (const k of keys) {
      const v = show(k), flagged = clue.flags?.[k];
      box.append(el("div", { class: "field" },
        el("div", { class: "k" }, FIELD_LABELS[k], flagged ? el("span", { class: "badge warn", title: "보호자 말에서 확인되지 않음" }, "⚠ 확인 필요") : "", (clue.edited ?? []).includes(k) ? el("span", { class: "tag-rule", style: "margin-left:6px" }, "보호자 수정") : ""),
        el("div", { class: "v" + (v ? "" : " empty") }, v ?? "아직 모름"),
        el("button", { class: "edit", onclick: () => edit(k) }, "✎")));
    }
    save();
  }
  // ✎ 수정: 눌러서 고르는 입력기 (글자 입력은 보충 칸에만)
  function edit(k) {
    const dlg = $("#edit-dialog");
    $("#edit-title").textContent = FIELD_LABELS[k];
    const ui = buildAnswerInput(k, $("#edit-body"), getPath(clue, k));
    const mark = () => { clue.edited = [...new Set([...(clue.edited ?? []), k])]; };
    $("#edit-ok").onclick = () => { setPath(clue, k, ui.value()); if (clue.flags) delete clue.flags[k]; mark(); dlg.close(); renderFields(); };
    $("#edit-clear").onclick = () => { setPath(clue, k, null); if (clue.flags) delete clue.flags[k]; mark(); dlg.close(); renderFields(); };
    $("#edit-cancel").onclick = () => dlg.close();
    dlg.showModal();
  }
  function renderPlaces() {
    const box = $("#places"); box.innerHTML = "";
    if (!clue.memory_places.length) box.append(el("p", { class: "muted small" }, "아직 없어요. 옛 동네, 단골 가게, 경로당처럼 가실 만한 곳을 추가하세요."));
    clue.memory_places.forEach((p, i) => box.append(el("div", { class: "field", style: "grid-template-columns:1fr auto auto" },
      el("div", { class: "v" }, p.name, el("span", { class: "badge src" }, SOURCE_LABELS[p.source] ?? "보호자가 말한 곳"), clue.flags?.[`memory_places.${i}`] ? el("span", { class: "badge warn" }, "⚠") : ""),
      el("button", { class: "edit", onclick: () => { const a = prompt("장소 이름", p.name); if (a === null) return; p.name = a.trim() || p.name; delete clue.flags?.[`memory_places.${i}`]; renderPlaces(); } }, "✎"),
      el("button", { class: "edit", onclick: () => { clue.memory_places.splice(i, 1); renderPlaces(); } }, "삭제"))));
    save();
  }
  $("#place-add").onclick = () => { const n = $("#place-new").value.trim(); if (!n) return; clue.memory_places.push({ name: n, source: "guardian", evidence: "화면 2에서 추가" }); $("#place-new").value = ""; renderPlaces(); };
  function save() { clue.missing = computeMissing(clue); store.sset(KEYS.clue, clue); }
  renderFields(); renderPlaces(); renderAiCard();

  // ---- "생성형 AI가 한 일": 원문 → AI 결과 → 코드 검증 → 보호자 확인. 심사·시연 때 AI가 어디에 쓰였는지 보이게 (원리 공개)
  function renderAiCard() {
    const box = $("#ai-card"), info = store.sget("rw_ai", null);
    if (mode.source === "form" || !info) { box.append(el("h2", { style: "margin:0" }, "서식으로 입력했어요 ", el("span", { class: "tag-rule" }, "AI 사용 안 함")), el("p", { class: "small muted", style: "margin:6px 0 0" }, "정해진 질문에 답한 값입니다. 요약·지도는 똑같이 만들어집니다.")); return; }
    const base = info.filled ?? clue;
    const val = (k) => { const v = getPath(base, k); return v !== null && v !== undefined && v !== ""; };
    const filled = keys.filter(val).length + (base.memory_places?.length ?? 0);
    const warn = Object.keys(base.flags ?? {}).length;
    const empty = computeMissing(base).length;
    const name = aiName(info) || "생성형 AI";
    box.append(
      el("h2", { style: "margin:0" }, "생성형 AI가 한 일 ", el("span", { class: "tag-ai" }, info.mock ? "모의 응답" : name)),
      el("p", { class: "small", style: "margin:6px 0 0" }, `보호자가 두서없이 한 말을 읽고 경찰 신고 서식으로 새로 썼어요${info.ms ? ` (${(info.ms / 1000).toFixed(1)}초)` : ""}.`),
      el("div", { class: "stats" },
        el("div", { class: "stat" }, el("b", {}, filled), el("span", {}, "AI가 채운 칸·장소")),
        el("div", { class: "stat" }, el("b", {}, warn), el("span", {}, "⚠ 원문에 없는 값")),
        el("div", { class: "stat" }, el("b", {}, empty), el("span", {}, "빈 칸 (코드가 셈)"))),
      el("p", { class: "flow" }, "보호자의 말 → ", el("b", {}, "생성형 AI가 서식으로 정리"), " → 코드가 원문과 대조(⚠)·빈 칸 계산 → ", el("b", {}, "생성형 AI가 빈 칸 질문"), " → 보호자 확인(✎)"),
      utter ? el("details", {}, el("summary", { class: "small" }, "보호자가 한 말 (원문)"), el("blockquote", {}, utter)) : "",
      info.raw ? el("details", {}, el("summary", { class: "small" }, "AI가 돌려준 원본 결과(JSON) 보기"), el("pre", {}, JSON.stringify(info.raw, null, 2))) : "");
  }

  // ---- 되묻기 (호출 ②) : 최대 3개, 하나씩
  let questions = [], qi = 0;
  const unknownKeys = new Set();
  async function loadQuestions() {
    if (computeMissing(clue).length === 0) return;
    $("#ask-loading").classList.remove("hidden");
    const res = await api("followup", { clue });
    $("#ask-loading").classList.add("hidden");
    if (!res.ok || !res.questions?.length) return; // AI 실패면 되묻기 없이 넘어감 (화면 3은 서식 값으로 가능)
    mockBanner(res);
    questions = res.questions; qi = 0; showQ();
  }
  function showQ() {
    if (qi >= questions.length) { $("#ask").classList.add("hidden"); return; }
    const q = questions[qi];
    $("#ask").classList.remove("hidden");
    $("#ask-count").innerHTML = ""; $("#ask-count").append(el("span", { class: "tag-ai" }, "생성형 AI가 만든 질문"), ` ${qi + 1} / ${questions.length} · ${FIELD_LABELS[q.key] ?? q.key} (빈 칸은 코드가 골라 주고, 묻는 문장은 AI가 씀)`);
    $("#ask-bar").style.width = `${(qi / questions.length) * 100}%`;
    $("#ask-q").textContent = q.question;
    askUI = buildAnswerInput(q.key, $("#ask-input"));
  }
  let askUI = null;
  $("#ask-answer").onclick = () => {
    const q = questions[qi];
    const v = askUI?.value();
    if (v === null || v === undefined) { alert("하나를 고르거나 적어 주세요. 모르면 [모름]을 누르세요."); return; }
    setPath(clue, q.key, v);
    qi++; renderFields(); showQ();
  };
  $("#ask-unknown").onclick = () => { const q = questions[qi]; unknownKeys.add(q.key); if (!isBool(q.key)) setPath(clue, q.key, "모름"); qi++; renderFields(); showQ(); };
  $("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#ask-answer").click(); });
  $("#skip").onclick = () => { save(); location.href = "/summary"; };
  $("#go").onclick = () => { save(); location.href = "/summary"; };
  loadQuestions();
</script>
</body>
</html>
